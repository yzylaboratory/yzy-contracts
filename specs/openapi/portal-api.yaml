        chassis_number:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        engine_number:
          type:
          - string
          - 'null'
        make:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
        plate:
          type:
          - string
          - 'null'
        registration_number:
          type:
          - string
          - 'null'
        source_document:
