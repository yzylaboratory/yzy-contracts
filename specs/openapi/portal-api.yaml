openapi: 3.1.0
info:
  title: YZY Contracts API
  description: 'Contract management: register original Word templates with variables, convert PDFs to editable templates, and generate documents. Private routes require the configured superadministrator or a person the superadministrator enabled.'
  license:
    name: ''
  version: 0.1.0
paths:
  /api/v1/admin/activity:
    get:
      tags:
      - Administration
      summary: Lists private portal activity for the accounts and invitations visible in Users.
      operationId: list
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: The requested activity page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Superadministrator access is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid pagination or search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The signing keys could not be retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/activity/{user_id}/events:
    get:
      tags:
      - Administration
      summary: Lists the selected account's private activity, most recent first.
      operationId: list_activity_events
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: The requested activity timeline page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityEventsPage'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Superadministrator access is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The user was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid user identifier or pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The signing keys could not be retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/billing/accounts:
    get:
      tags:
      - Billing
      operationId: admin_accounts
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Billing accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccountList'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
    post:
      tags:
      - Billing
      operationId: create_account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccount'
        required: true
      responses:
        '201':
          description: Legacy billing account created for companies without a dedicated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The bank account is missing or a company already has a billing account for this period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid account details or manager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/billing/accounts/{id}:
    put:
      tags:
      - Billing
      operationId: update_account
      parameters:
      - name: id
        in: path
        description: Billing account ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
        required: true
      responses:
        '200':
          description: Billing account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Billing account or company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: A company already has a billing account for this period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid account details or manager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/billing/bank-account:
    get:
      tags:
      - Billing
      operationId: admin_bank_account
      responses:
        '200':
          description: Effective transfer destination and current revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountSettings'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
    put:
      tags:
      - Billing
      operationId: save_admin_bank_account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountInput'
        required: true
      responses:
        '200':
          description: Transfer destination saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountSettings'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The transfer destination revision has changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid bank account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/billing/invoices:
    get:
      tags:
      - Billing
      operationId: admin_invoices
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: in_review
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Invoices across billing accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoiceList'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/billing/invoices/{id}/verification:
    put:
      tags:
      - Billing
      operationId: verify_transfer
      parameters:
      - name: id
        in: path
        description: Invoice ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationInput'
        required: true
      responses:
        '200':
          description: Reported transfer confirmed or rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Invoice or report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The report was already reviewed with another decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/billing/pricing:
    get:
      tags:
      - Billing
      operationId: admin_pricing
      responses:
        '200':
          description: Membership price in USD and DOP exchange rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPricing'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
    put:
      tags:
      - Billing
      operationId: save_admin_pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingPricingInput'
        required: true
      responses:
        '200':
          description: Membership pricing saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPricing'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The pricing revision has changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid pricing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/companies:
    get:
      tags:
      - Administration
      operationId: admin_companies
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Company profiles and pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCompanyPage'
        '403':
          description: Superadministrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/dashboard:
    get:
      tags:
      - Administration
      operationId: summary
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Platform usage, billing and seven-day portal visit summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/insurance-carriers:
    get:
      tags:
      - Administration
      operationId: admin_carriers
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierPage'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
    post:
      tags:
      - Administration
      operationId: create_carrier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierWrite'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrier'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/insurance-carriers/{carrier_id}:
    put:
      tags:
      - Administration
      operationId: update_carrier
      parameters:
      - name: carrier_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierWrite'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrier'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
    delete:
      tags:
      - Administration
      operationId: delete_carrier
      parameters:
      - name: carrier_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Carrier deleted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/requests:
    get:
      tags:
      - Administration
      operationId: requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/users:
    get:
      tags:
      - Administration
      operationId: users
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserStatus'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 250
          maximum: 250
          minimum: 1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid pagination or search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/users/{id}/access:
    put:
      tags:
      - Administration
      summary: Enables or disables a person's access to YZY Contracts.
      operationId: set_user_access
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAccess'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserItem'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The person has not signed in to YZY Contracts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: The superadministrator's own access cannot change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/admin/users/{id}/billing:
    put:
      tags:
      - Administration
      summary: Assigns or removes a person as billing manager of every billing account.
      operationId: set_user_billing
      parameters:
      - name: id
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBilling'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserItem'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The person has not signed in to YZY Contracts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Only enabled users can manage billing, and each account needs a manager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/billing:
    get:
      tags:
      - Billing
      operationId: overview
      responses:
        '200':
          description: Assigned billing accounts, invoices and optional bank details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOverview'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Billing manager access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/billing/accounts/{id}/renewal-invoice:
    post:
      tags:
      - Billing
      operationId: prepare_renewal
      parameters:
      - name: id
        in: path
        description: Billing account ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: First unpaid invoice for the renewal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Billing manager access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Billing account not assigned to the manager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Renewal currently unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - bearer_auth: []
  /api/v1/billing/invoices/{id}/transfer:
    put:
      tags:
      - Billing
      operationId: report_transfer
      parameters:
      - name: id
        in: path
        description: Invoice ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferInput'
        required: true
      responses:
        '200':
          description: Bank transfer reported for manual review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Billing manager access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Invoice not found in an assigned account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Invoice already has a different transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
