            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: TEMPLATE_NOT_FOUND
                  message: Template not found
      security:
      - bearer_auth: []
    put:
      tags:
      - Templates
      summary: |-
        Replaces a template's name and legacy Markdown. Native Word templates accept
        name changes with empty content_markdown; their source and manifest stay fixed.
      operationId: update_template
      parameters:
      - name: id
        in: path
        description: Template ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateRequest'
            example:
              content_markdown: |-
                # Contrato de arrendamiento

                ## Primera. Objeto

                ...
              name: Contrato de arrendamiento
        required: true
      responses:
        '200':
          description: The updated template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required
        '404':
          description: The template does not exist or belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: TEMPLATE_NOT_FOUND
                  message: Template not found
        '413':
          description: The content exceeds the size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: The request body is too large
        '422':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 'Invalid value for: name'
      security:
      - bearer_auth: []
