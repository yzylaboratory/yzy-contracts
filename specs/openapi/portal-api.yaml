tags:
- name: System
  description: Service health
- name: Users
  description: The authenticated user
- name: Administration
  description: Company access and invitations
- name: Clients
  description: Global client directory and company-scoped case files for enabled people
- name: Prospects
  description: Self-registration links shared with prospects, and the people who submit through them before a case file exists
- name: Companies
  description: Reusable company details owned by the authenticated account
- name: Files
  description: Direct uploads to private storage
- name: Contracts
  description: Contract records owned by the authenticated user
- name: Conversions
  description: Asynchronous PDF and DOCX to Markdown conversions
- name: Templates
  description: Original Word templates with variables and legacy editable templates
- name: Generated documents
  description: Saved exports and statistics for the authenticated account
- name: Insurance
  description: DEV only. Company-scoped policies, due dates and manually recorded payments. Carriers are a global catalog managed by the superadministrator; companies only pick one. Dates are local to Santo Domingo; amounts are in DOP cents.
- name: Billing
  description: Monthly company billing and bank transfers
- name: Document readings
  description: Structured JSON read from photos or PDFs of identity cards, vehicle registrations and bills of lading
