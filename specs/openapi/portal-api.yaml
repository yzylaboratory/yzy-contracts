          minItems: 1
      additionalProperties: false
    UpdateTemplateRequest:
      type: object
      required:
      - name
      - content_markdown
      properties:
        content_markdown:
          type: string
          example: |-
            # Contrato de arrendamiento

            ## Primera. Objeto

            ...
        name:
          type: string
          example: Contrato de arrendamiento
      additionalProperties: false
    UserAccess:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: '`true` lets the person work in every active company; `false` removes access.'
      additionalProperties: false
    UserBilling:
      type: object
      required:
      - manages_billing
      properties:
        manages_billing:
          type: boolean
          description: '`true` assigns the person as billing manager of every account; `false` removes that role.'
      additionalProperties: false
    UserItem:
      type: object
      required:
      - email
      - status
      - company_ids
      - created_at
      - manages_billing
      properties:
        company_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        email:
          type: string
        id:
          type:
          - string
          - 'null'
          format: uuid
        manages_billing:
          type: boolean
          description: Whether this person manages at least one billing account.
        name:
          type:
          - string
          - 'null'
        notice:
          oneOf:
          - $ref: '#/components/schemas/Notice'
          - type: 'null'
        status:
          $ref: '#/components/schemas/UserStatus'
    UserList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserItem'
    UserPage:
      type: object
      required:
      - items
      - page
      - per_page
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserItem'
        page:
          type: integer
          format: int64
        per_page:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    UserStatus:
      type: string
      enum:
      - pending
      - invited
      - active
      - suspended
    Vehicle:
      type: object
