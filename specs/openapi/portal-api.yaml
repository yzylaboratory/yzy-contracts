          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required
        '422':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 'Invalid value for: per_page'
      security:
      - bearer_auth: []
    post:
      tags:
      - Contracts
      summary: |-
        Registers a finished upload after inspecting the stored object.
        New Word files must contain variables such as {{cliente_nombre}} in editable
        text. Their exact source is preserved and they are immediately ready to
        generate, with one field per variable and no Markdown conversion.
      operationId: create_contract
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
            example:
              description: Plantilla base para vivienda
              name: Contrato de arrendamiento
              upload_id: 7f1d3a52-6c1e-4d0b-9a57-2f6b1c8e4a10
        required: true
      responses:
        '201':
          description: The contract was registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required
        '404':
          description: The upload does not exist or belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UPLOAD_NOT_FOUND
                  message: Upload not found
        '409':
          description: The file is not in storage yet, or the upload was already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UPLOAD_NOT_COMPLETED
                  message: The file has not finished uploading
        '410':
          description: The upload expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UPLOAD_EXPIRED
                  message: This upload has expired; request a new upload URL
        '422':
          description: Invalid sharing scope, upload mismatch, or a Word file is damaged, has no variables, or has invalid variables (VALIDATION_ERROR, UPLOAD_MISMATCH, INVALID_DOCX_TEMPLATE, DOCX_VARIABLES_REQUIRED, INVALID_DOCX_VARIABLES)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: UPLOAD_MISMATCH
                  message: The uploaded file does not match what was declared
      security:
      - bearer_auth: []
