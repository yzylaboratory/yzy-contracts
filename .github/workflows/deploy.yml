name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - services/api/**
      - apps/portal/**
      - supabase/migrations/**
      - package.json
      - pnpm-lock.yaml
      - docker-compose.yml
      - ops/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-dev:
    name: "Build DEV (${{ matrix.name }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: services/api/Dockerfile
            build-args: |
              CONTRACTS_BUILD_ENV=development
          - name: portal
            dockerfile: apps/portal/Dockerfile
            build-args: |
              NEXT_PUBLIC_SUPABASE_URL=https://yzycontracts.yzylabs.dev
              NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.DEV_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
              NEXT_PUBLIC_API_URL=https://yzycontracts.yzylabs.dev
              NEXT_PUBLIC_SITE_URL=https://yzycontracts.yzylabs.dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: "ghcr.io/yzylaboratory/yzy-contracts-${{ matrix.name }}:dev-sha-${{ github.sha }}"
          cache-from: type=gha,scope=dev-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.name }}
          build-args: ${{ matrix.build-args }}

  deploy-dev:
    name: Deploy development
    needs: build-dev
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      packages: read
    steps:
      - name: Deploy on Hetzner DEV
        env:
          SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_DEPLOY_KNOWN_HOSTS }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            root@${{ vars.DEV_DEPLOY_HOST }} "dev-sha-${{ github.sha }}"

  build-production:
    name: "Build production (${{ matrix.name }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: portal
            dockerfile: apps/portal/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: "ghcr.io/yzylaboratory/yzy-contracts-${{ matrix.name }}:sha-${{ github.sha }}"
          cache-from: type=gha,scope=prod-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=https://yzycontracts.yzylabs.com
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

  deploy-production:
    name: Deploy production
    needs: [build-production, deploy-dev]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Approvals are independent. Hetzner serializes the approved deployments.
    permissions:
      packages: read
    steps:
      - name: Deploy on Hetzner
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            root@${{ vars.DEPLOY_HOST }} "sha-${{ github.sha }}"

  notify-build-failure:
    name: Notify build failure
    needs: [build-dev, build-production]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Notify build failure
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes \
            root@${{ vars.DEPLOY_HOST }} "build-failed sha-${{ github.sha }}" < /dev/null
