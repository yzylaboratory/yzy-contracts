worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent "$http_referer"';
    access_log /dev/stdout main;

    # Preserve HTTPS scheme from Cloudflare Tunnel; fall back to local scheme.
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    map $http_authorization $signed_object_header {
        default 0;
        "~^AWS4-HMAC-SHA256 " 1;
    }

    map "$signed_object_header:$arg_x_amz_signature" $signed_object_request {
        default 0;
        ~^1:    1;
        "~^0:[a-f0-9]{64}$" 1;
    }

    server {
        listen 8080 default_server;
        server_name yzycontracts.yzylabs.dev _;

        # Re-resolve Docker service IPs dynamically so rolling restarts of api/portal/auth
        # never leave stale upstream IPs cached in nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Internal container healthcheck endpoint.
        location = /edge-healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Never expose GoTrue admin/invite endpoints or unconfigured Supabase surfaces externally.
        location = /auth/v1/admin {
            return 403;
        }
        location ^~ /auth/v1/admin/ {
            return 403;
        }
        location = /auth/v1/invite {
            return 403;
        }
        location ^~ /auth/v1/invite/ {
            return 403;
        }
        location ^~ /rest/v1/ {
            return 404;
        }
        location ^~ /storage/v1/ {
            return 404;
        }
        location ^~ /pg/ {
            return 404;
        }
        location ^~ /studio/ {
            return 404;
        }

        location = /yzy-contracts-dev/ {
            return 404;
        }
        location ^~ /yzy-contracts-dev/ {
            if ($signed_object_request = 0) { return 403; }
            limit_except GET PUT DELETE { deny all; }
            set $storage_upstream http://storage:9000;
            proxy_pass $storage_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            client_max_body_size 32m;
            proxy_request_buffering off;
            access_log off;
        }

        # Rust API (/api/v1/*)
        location = /api/v1 {
            return 404;
        }
        location ^~ /api/v1/ {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            client_max_body_size 32m;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # GoTrue Auth (/auth/v1/*) — strip /auth/v1 prefix while forwarding X-Forwarded-Prefix.
        # Note: Portal's own /auth/callback page is intentionally NOT under /auth/v1/ and goes to portal.
        location = /auth/v1 {
            return 404;
        }
        location ^~ /auth/v1/ {
            rewrite ^/auth/v1/(.*)$ /$1 break;
            set $auth_upstream http://auth:9999;
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /auth/v1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Next.js Portal (all remaining routes, including /login and /auth/callback)
        location / {
            set $portal_upstream http://portal:3000;
            proxy_pass $portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
