name: yzy-contracts-dev

x-api-service: &api-service
  image: ${CONTRACTS_API_IMAGE:?set by deploy-contracts-dev.sh}
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  env_file:
    - ./api.env
    - ./api.access.env
  volumes:
    - ./shared-postgres-ca.crt:/run/shared-postgres-ca.crt:ro
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
  mem_limit: 512m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # DEV-only object storage. The edge accepts signed object requests for this bucket.
  storage:
    profiles: ["local-s3"]
    image: chrislusf/seaweedfs:4.53
    container_name: yzy-contracts-dev-storage
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=9000", "-volume.max=50", "-master.volumeSizeLimitMB=64"]
    restart: unless-stopped
    env_file:
      - ./storage.env
    volumes:
      - storage-data:/data
    networks:
      - edge-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  storage-init:
    profiles: ["local-s3"]
    image: amazon/aws-cli:2.27.0
    container_name: yzy-contracts-dev-storage-init
    depends_on:
      storage:
        condition: service_healthy
    env_file:
      - ./storage.env
    entrypoint:
      - /bin/bash
      - -c
      - >-
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$${DEV_S3_BUCKET}"
        || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket "$${DEV_S3_BUCKET}"
    restart: "no"
    networks:
      - edge-net

  renderer:
    image: ${CONTRACTS_RENDERER_IMAGE:?set in .env}
    container_name: yzy-contracts-dev-renderer
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./renderer.env
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cpus: 1.5
    mem_limit: 768m
    pids_limit: 128
    networks:
      - renderer
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  doc-extractor:
    image: ${CONTRACTS_EXTRACTOR_IMAGE:?set in .env}
    container_name: yzy-contracts-dev-doc-extractor
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./doc-extractor.env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      DOCLING_ARTIFACTS_PATH: "/opt/docling-models"
      HF_HOME: "/opt/hf-cache"
      TMPDIR: "/tmp"
      XDG_CACHE_HOME: "/tmp/cache"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    mem_limit: 4g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - extractor
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    <<: *api-service
    container_name: yzy-contracts-dev-api
    command: ["serve"]
    depends_on:
      renderer:
        condition: service_healthy
    networks:
      - renderer
      - edge-net
      - egress-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *api-service
    container_name: yzy-contracts-dev-worker
    command: ["worker"]
    networks:
      - extractor
      - edge-net
      - egress-net

  portal:
    image: ${CONTRACTS_PORTAL_IMAGE:?set by deploy-contracts-dev.sh}
    container_name: yzy-contracts-dev-portal
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      SITE_URL: https://yzycontracts.yzylabs.dev
      API_URL: http://api:8080
    networks:
      - edge-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Same-origin edge reverse proxy for yzycontracts.yzylabs.dev (loopback only).
  edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: yzy-contracts-dev-edge
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_EDGE_BIND_PORT:-8850}:8080"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=32m,mode=1777
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    mem_limit: 128m
    networks:
      - edge-net
      - tunnel
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/edge-healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  storage-data:
    name: yzy-contracts-dev-storage-data

networks:
  renderer:
    name: yzy-contracts-dev-renderer
    internal: true
  extractor:
    name: yzy-contracts-dev-extractor
  edge-net:
    name: yzy-contracts-dev-edge-net
  egress-net:
    name: yzy-contracts-dev-egress-net
  tunnel:
    name: ${DEV_TUNNEL_NETWORK:-yzy-automation_default}
    external: true
