name: doc-extractor-api

services:
  doc-extractor-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: yzylabs/doc-extractor-api:0.1.0
    container_name: yzy-contracts-doc-extractor
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      DOCLING_ARTIFACTS_PATH: "/opt/docling-models"
      HF_HOME: "/opt/hf-cache"
      TMPDIR: "/tmp"
      XDG_CACHE_HOME: "/tmp/cache"
    ports:
      - "${DOC_EXTRACTOR_BIND_HOST:-127.0.0.1}:${DOC_EXTRACTOR_HOST_PORT:-8840}:8000"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
